<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link password</title>
  <link rel="stylesheet" href="password.css">
</head>
<body>
  <h2>Password for your Nextcloud link</h2>
  <p id="intro" class="hint"></p>

  <div class="row">
    <output id="password" aria-label="Password"></output>
    <button id="copy-btn" type="button">Copy</button>
  </div>
  <p id="copied" class="hint" role="status"></p>

  <fieldset>
    <legend>How should the recipient get it?</legend>
    <label class="choice">
      <input type="radio" name="delivery" value="separate" checked>
      <span><strong>In a separate email</strong> (recommended)<br>
        <span class="hint">After you send this message, a second email to the same people opens with only the password, for you to check and send.</span></span>
    </label>
    <label class="choice">
      <input type="radio" name="delivery" value="same">
      <span><strong>In this email</strong>, below the link<br>
        <span class="hint">Easiest for the recipient, but anyone who gets this email can open the files.</span></span>
    </label>
    <label class="choice">
      <input type="radio" name="delivery" value="self">
      <span><strong>I'll send it myself</strong><br>
        <span class="hint">For example by text message or chat. It is on your clipboard.</span></span>
    </label>
  </fieldset>

  <label class="check"><input id="remember" type="checkbox"> Remember my choice for this account</label>

  <div class="actions">
    <button id="done-btn" type="button">Done</button>
  </div>

  <script type="module" src="password.js"></script>
</body>
</html>
